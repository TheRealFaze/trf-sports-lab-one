name: process-enrichment-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/process-enrichment-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Bootstrap all eight leagues
        run: |
          python scripts/bootstrap_football_data.py \
            --output data/process \
            --divisions E0 B1 D1 I1 SP1 F1 N1 P1 \
            --years 2019 2020 2021 2022 2023 2024 2025
      - name: Run process enrichment audit
        run: |
          python scripts/run_process_enrichment_audit.py \
            --process data/process/process.csv \
            --odds data/process/odds_1x2.csv \
            --output data/process/process_audit.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: trf-process-enrichment-audit
          path: |
            data/process/process_audit.json
            data/process/quality.csv
          retention-days: 30
