name: live-one-market-map

on:
  workflow_dispatch:
    inputs:
      sports:
        description: "Space-separated The Odds API sport keys"
        required: true
        default: "soccer_epl"
      markets:
        description: "Comma-separated market keys"
        required: true
        default: "h2h,totals"
      min_ev:
        description: "Minimum prudent EV, decimal"
        required: true
        default: "0.02"
      queue_top:
        description: "Napoleon soft-gate checks"
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require market API secret
        run: |
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "Missing repository secret THE_ODDS_API_KEY"
            exit 1
          fi
      - name: Install
        run: pip install -e .
      - name: Build live market map
        run: |
          python scripts/live_one.py \
            --sports ${{ inputs.sports }} \
            --markets "${{ inputs.markets }}" \
            --regions "eu,uk" \
            --min-books 3 \
            --min-ev "${{ inputs.min_ev }}" \
            --queue-top "${{ inputs.queue_top }}" \
            --output-dir live_output
      - name: Upload market map and Napoleon queue
        uses: actions/upload-artifact@v4
        with:
          name: one-live-market-map
          path: live_output/
          retention-days: 7
